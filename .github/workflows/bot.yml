name: Run Discord Bot

"on":
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      # 1. Kéo repository về
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Cài đặt 7-Zip
      - name: Install 7-Zip
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      # 3. Cài đặt Python 3.11
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 4. Cài đặt Node.js 20
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 5. Giải nén bot.7z thẳng vào thư mục làm việc
      - name: Extract bot.7z
        env:
          ZIP_PASS: ${{ secrets.ZIP_PASSWORD }}
        run: |
          ARCHIVE_PATH=$(find . -name "bot.7z" | head -n 1)
          if [ -z "$ARCHIVE_PATH" ]; then
            echo "LỖI: Không tìm thấy file bot.7z!"
            exit 1
          fi
          
          echo "Đang giải nén $ARCHIVE_PATH..."
          7z x "$ARCHIVE_PATH" -p"$ZIP_PASS" -o. -y -aoa

      # 6. Cài đặt các thư viện dependencies
      - name: Install Dependencies
        run: |
          npm install acorn@^8.11.3 acorn-walk@^8.3.2 discord.js@^14.16.0 dotenv@^16.4.5 @discordjs/opus@^0.9.0 @discordjs/voice@^0.18.0 ffmpeg-static@^5.2.0 sodium-native@^4.0.9

      # 7. Khởi chạy thẳng index.js
      - name: Start Bot
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: |
          node index.js
