name: Windows RDP Ngrok (Direct IP Fix 0x104)

on:
  workflow_dispatch:
  repository_dispatch:
    types: [create-vps]

# ================================================================
# ⚙️ CẤU HÌNH GOM HẾT Ở ĐÂY
# ================================================================
env:
  # 👤 Tài khoản đăng nhập trên app điện thoại
  RDP_USER: "zeraa"
  RDP_PASSWORD: "Zeraa@Pass12345"

  # 🔑 Token xác thực
  NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
  GH_TOKEN: ${{ secrets.GH_TOKEN }}

  # ⏱️ Thời gian hoạt động
  TOTAL_MINUTES: 330          # Tổng thời gian chạy (~5.5 tiếng)
  RESTART_CHECKPOINT: 320     # Báo trước khi restart (phút thứ 320)
# ================================================================

jobs:
  rdp-deploy:
    runs-on: windows-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: ⬇️ Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 🔓 Kích hoạt & Khởi động Dịch vụ RDP
        shell: pwsh
        run: |
          Write-Host "🔧 1. Bật và khởi động dịch vụ TermService..."
          Set-Service -Name "TermService" -StartupType Automatic
          Start-Service -Name "TermService" -ErrorAction SilentlyContinue

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0

          Write-Host "🔥 2. Mở Firewall cổng 3389..."
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
          netsh advfirewall firewall add rule name="Allow RDP 3389" dir=in action=allow protocol=TCP localport=3389

          Write-Host "👤 3. Tạo user: $env:RDP_USER..."
          net user $env:RDP_USER "$env:RDP_PASSWORD" /add
          net localgroup Administrators $env:RDP_USER /add
          net localgroup "Remote Desktop Users" $env:RDP_USER /add
          net user runneradmin "$env:RDP_PASSWORD"
          Write-Host "✅ Dịch vụ Windows RDP đã chạy!"

      - name: 🌐 Khởi chạy Ngrok & Phân giải IP số
        shell: pwsh
        run: |
          if (-not $env:NGROK_AUTH_TOKEN) {
            Write-Host "❌ THIẾU NGROK_AUTH_TOKEN! Vui lòng kiểm tra mục GitHub Secrets."
            exit 1
          }

          Write-Host "📥 Đang tải Ngrok..."
          Invoke-WebRequest -Uri "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" -OutFile "ngrok.zip" -TimeoutSec 60
          Expand-Archive -Path "ngrok.zip" -DestinationPath "." -Force

          Write-Host "🔑 Cấu hình Ngrok Authtoken..."
          .\ngrok.exe config add-authtoken "$env:NGROK_AUTH_TOKEN"

          Write-Host "🚀 Khởi động Tunnel RDP..."
          Start-Process -FilePath ".\ngrok.exe" -ArgumentList "tcp 3389 --log=stdout" -RedirectStandardOutput "ngrok.log" -WindowStyle Hidden
          Start-Sleep -Seconds 8

          $maxAttempts = 15
          $rdpDomain = ""
          for ($i = 1; $i -le $maxAttempts; $i++) {
            try {
              $response = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels" -TimeoutSec 5
              if ($response.tunnels -and $response.tunnels.Count -gt 0) {
                $rdpDomain = $response.tunnels[0].public_url -replace "tcp://", ""
                break
              }
            } catch {
              Start-Sleep -Seconds 2
            }
          }

          if (-not $rdpDomain) {
            Write-Host "❌ Không lấy được URL Ngrok!"
            Get-Content "ngrok.log" -ErrorAction SilentlyContinue | Write-Host
            exit 1
          }

          # Tách Host và Port để lấy IP số
          $hostParts = $rdpDomain -split ':'
          $hostName = $hostParts[0]
          $port = $hostParts[1]
          
          try {
            $resolvedIP = [System.Net.Dns]::GetHostAddresses($hostName)[0].IPAddressToString
            $directIP = "$resolvedIP`:$port"
          } catch {
            $directIP = $rdpDomain
          }

          Write-Host "=========================================================="
          Write-Host "🎉 THÔNG TIN NHẬP VÀO APP TRÊN ĐIỆN THOẠI:"
          Write-Host "👉 CÁCH 1 (KHUYÊN DÙNG - BỎ QUA CHẶN MẠNG VN):"
          Write-Host "📌 PC name (IP số) : $directIP"
          Write-Host ""
          Write-Host "👉 CÁCH 2 (Tên miền gốc):"
          Write-Host "📌 PC name (Domain): $rdpDomain"
          Write-Host ""
          Write-Host "👤 User account    : $env:RDP_USER"
          Write-Host "🔑 Password        : $env:RDP_PASSWORD"
          Write-Host "=========================================================="

          try {
            $directIP | Out-File -FilePath "rdp-info.txt" -Encoding UTF8
            git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git config --global user.name "github-actions[bot]"
            git add rdp-info.txt
            git commit -m "🔗 Cập nhật IP: $directIP" --allow-empty | Out-Null
            git pull --rebase origin main --autostash 2>$null | Out-Null
            git push origin main --force 2>$null | Out-Null
          } catch {}
          
          $LASTEXITCODE = 0

      - name: ⏳ Giữ VPS sống
        shell: pwsh
        run: |
          $total = [int]$env:TOTAL_MINUTES
          $check = [int]$env:RESTART_CHECKPOINT
          
          Write-Host "🚀 RDP VPS đang hoạt động. Thời gian duy trì: $total phút."
          
          for ($i = 1; $i -le $total; $i++) {
            $now = Get-Date -Format 'HH:mm:ss'
            Write-Host "🟢 [Phút $i/$total] [$now] RDP Server chạy ổn định."
            
            if ($i -eq $check) {
              Write-Host "⚠️ Chuẩn bị chuyển đổi phiên trong $($total - $i) phút..."
            }
            
            Start-Sleep -Seconds 60
          }

      - name: 🔄 Tự động Restart phiên mới
        if: always()
        shell: pwsh
        run: |
          $now = Get-Date -Format 'yyyy-MM-dd HH:mm:ss'
          Write-Host "🔁 Bắt đầu quá trình Restart tại: $now"

          try {
            Stop-Process -Name "ngrok" -Force -ErrorAction SilentlyContinue
          } catch {}

          if (-not $env:GH_TOKEN) {
            Write-Host "⚠️ Không có GH_TOKEN, bỏ qua bước tự động restart."
            exit 0
          }

          try {
            $headers = @{
              "Accept" = "application/vnd.github+json"
              "Authorization" = "Bearer $env:GH_TOKEN"
              "X-GitHub-Api-Version" = "2022-11-28"
            }

            $payload = @{
              event_type = "create-vps"
              client_payload = @{
                restart_time = $now
                auto_restart = $true
              }
            } | ConvertTo-Json -Depth 2

            Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/dispatches" -Method Post -Headers $headers -Body $payload -TimeoutSec 30
            Write-Host "✅ Đã trigger phiên làm việc tiếp theo thành công!"
          } catch {
            Write-Host "❌ Lỗi kích hoạt phiên mới: $_"
          }
